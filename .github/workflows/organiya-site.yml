name: Organiya production site checks
on:
  push:
    branches: [codex/organiya-launch]
    paths: ['site/**', '.github/workflows/organiya-site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/organiya-site.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: organiya-test-results
          path: site/test-results
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: organiya-static-site
          path: site/dist
          include-hidden-files: true
          retention-days: 14
